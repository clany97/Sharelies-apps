# The software factory. Two ways in:
#   1. Add the `factory:build` label to an "App idea" or "Change to an app" issue.
#   2. Comment `@claude <request>` on an issue or pull request (e.g. to ask for fixes on a PR).
# The agent works on a branch and opens a pull request. A human always reviews and merges.
name: Factory

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: factory-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    # Only the repo owner can start the factory, so it can't be triggered by strangers.
    if: >
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'factory:build') ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A labelled issue gets the full factory brief; an @claude comment is answered as written.
          prompt: ${{ github.event_name == 'issues' && format('Factory job for issue #{0}. Read factory/prompts/factory-job.md and follow it exactly.', github.event.issue.number) || '' }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm run *),Bash(npm install *),Bash(npm ci),Bash(git *),Bash(gh pr *),Bash(gh issue *)"
